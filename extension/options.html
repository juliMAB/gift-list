<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Leer regalo · Configuración</title>
  <style>
    body { max-width: 560px; margin: 32px auto; padding: 0 16px;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; }
    h1 { font-size: 18px; }
    label { display: block; font-size: 12px; color: #475569; margin: 14px 0 4px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    .row { margin-top: 18px; display: flex; align-items: center; gap: 12px; }
    button { border: 0; border-radius: 6px; padding: 9px 14px; font: inherit; font-weight: 600;
      background: #4f46e5; color: #fff; cursor: pointer; }
    #msg { color: #047857; }
    .hint { font-size: 12px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Configuración de "Leer regalo"</h1>
  <p class="hint">Ya viene con los datos de tu lista. Solo cambialos si creaste otro proyecto.</p>

  <label for="supabaseUrl">URL de Supabase</label>
  <input id="supabaseUrl" type="url" placeholder="https://xxxxxxxx.supabase.co" />

  <label for="anonKey">Anon key de Supabase</label>
  <input id="anonKey" type="text" placeholder="eyJhbGci..." />

  <label for="appUrl">URL de la lista</label>
  <input id="appUrl" type="url" placeholder="https://..." />

  <div class="row">
    <button id="save" type="button">Guardar</button>
    <span id="msg"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
