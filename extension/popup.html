<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      width: 360px; margin: 0; padding: 12px;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a;
    }
    h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between; }
    h1 button { font-size: 11px; }
    label { display: block; font-size: 11px; color: #475569; margin: 8px 0 3px; }
    input[type="text"], input[type="url"], textarea {
      width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px;
      font: inherit; background: #fff;
    }
    textarea { resize: vertical; min-height: 44px; }
    #thumbwrap { display: none; margin-top: 8px; }
    #thumb { max-width: 100%; max-height: 120px; border-radius: 6px; border: 1px solid #e2e8f0; }
    .status { margin: 10px 0 0; font-size: 12px; min-height: 16px; color: #475569; }
    .status.ok { color: #047857; }
    .status.err { color: #b91c1c; }
    .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    button {
      border: 0; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer;
      background: #4f46e5; color: #fff; font-weight: 600;
    }
    button.ghost { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; font-weight: 500; }
    button:disabled { opacity: .5; cursor: default; }
    #donebar { display: none; margin-top: 10px; align-items: center; gap: 8px; }
    a { color: #4f46e5; }
  </style>
</head>
<body>
  <h1>
    Leer regalo
    <button id="reload" class="ghost" type="button">Releer página</button>
  </h1>

  <label for="title">Título</label>
  <input id="title" type="text" placeholder="Nombre del producto" />

  <label for="description">Descripción</label>
  <textarea id="description" placeholder="Detalles (opcional)"></textarea>

  <label for="price">Precio</label>
  <input id="price" type="text" placeholder="Ej: $ 350.000" />

  <label for="image_url">Link de la foto</label>
  <input id="image_url" type="url" placeholder="https://..." />

  <label for="link">Link del producto</label>
  <input id="link" type="url" placeholder="https://..." />

  <div id="thumbwrap"><img id="thumb" alt="" /></div>

  <p id="status" class="status"></p>

  <div class="row">
    <button id="submit" type="button">Agregar a la lista</button>
  </div>

  <div id="donebar">
    <a id="viewlist" href="#" target="_blank" rel="noopener">Ver la lista</a>
    <span class="status" style="margin:0">·</span>
    <a id="options" href="#">Configuración</a>
  </div>

  <script src="extract.js"></script>
  <script src="popup.js"></script>
</body>
</html>
